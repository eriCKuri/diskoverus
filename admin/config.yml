backend:
  name: github
  repo: eriCKuri/diskoverus
  branch: main
  base_url: https://api.netlify.com

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://diskoverus.com
display_url: https://diskoverus.com
logo_url: https://diskoverus.com/assets/logo.png

collections:
  - name: "destinations"
    label: "Destinations"
    files:
      - name: "countries"
        label: "Country content"
        file: "content/places.json"
        description: "Edit a country's intro and activities, or add a brand-new country. IMPORTANT: the country name must exactly match its name on the map (e.g. Uganda, Kenya, New Zealand)."
        fields:
          - label: "Countries"
            name: "countries"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Country name (must match the map)", name: "name", widget: "string" }
              - { label: "Region label", name: "region", widget: "string", required: false, hint: "e.g. East Africa" }
              - { label: "Intro blurb", name: "blurb", widget: "text", required: false, hint: "One or two sentences shown under the country name" }
              - label: "Activities"
                name: "activities"
                widget: "list"
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Category", name: "category", widget: "select", options: ["culture","nature","food","adventure"] }
                  - { label: "Duration", name: "duration", widget: "select", options: [{label: "Morning", value: "morning"},{label: "Evening", value: "evening"},{label: "Half day", value: "half"},{label: "Full day", value: "full"},{label: "Multi-day", value: "multi"}] }
                  - { label: "Photo", name: "image", widget: "image", required: false }
  - name: "gallery"
    label: "Gallery"
    files:
      - name: "photos"
        label: "Gallery photos"
        file: "content/gallery.json"
        description: "Photos shown on the Gallery page, each linked to its country. Keep images web-sized (under ~2 MB)."
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.country}} — {{fields.caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - label: "Country"
                name: "country"
                widget: "select"
                options: ["Argentina","Australia","Chile","Costa Rica","Croatia","Egypt","France","Greece","Iceland","India","Indonesia","Italy","Japan","Jordan","Kenya","Mexico","Morocco","New Zealand","Norway","Peru","Portugal","South Africa","Spain","Sri Lanka","Switzerland","Tanzania","Thailand","Vietnam"]
              - { label: "Caption", name: "caption", widget: "string", required: false, hint: "e.g. Sunrise over the Maasai Mara" }
  - name: "blog"
    label: "Blog posts"
    files:
      - name: "posts"
        label: "All blog posts"
        file: "content/blog.json"
        description: "Add, edit, reorder, or delete blog posts. Top of the list = top of the blog page."
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date line", name: "date", widget: "string", required: false, hint: "Shown above the title, e.g. July 2026 · Field notes" }
              - { label: "Image", name: "image", widget: "image", required: false, hint: "Optional header photo — upload or paste a URL" }
              - { label: "Body", name: "body", widget: "text", hint: "Blank line = new paragraph" }
