backend:
  name: github
  repo: eriCKuri/diskoverus
  branch: main
  base_url: https://api.netlify.com
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://diskoverus.com
display_url: https://diskoverus.com
logo_url: https://diskoverus.com/assets/logo.png
collections:
- name: settings
  label: Site settings
  files:
  - name: site
    label: Homepage
    file: content/settings.json
    description: Control the homepage hero background. Video wins over image if both are set.
    fields:
    - label: Hero background image
      name: heroImage
      widget: image
      required: false
      hint: Replaces the sunset photo. Landscape, ~1600px wide, under 1 MB.
    - label: Hero background video URL
      name: heroVideo
      widget: string
      required: false
      hint: Direct link to an .mp4 file (from Cloudinary or similar). NOT a YouTube link — must end in .mp4. Plays muted on loop.
- name: destinations
  label: Destinations
  files:
  - name: countries
    label: Country content
    file: content/places.json
    description: 'Edit a country''s intro and activities, or add a brand-new country. IMPORTANT: the country name must exactly match its map name (e.g. Rwanda, Kenya, New Zealand).'
    fields:
    - label: Countries
      name: countries
      widget: list
      summary: '{{fields.name}}'
      fields:
      - label: Country name (must match the map)
        name: name
        widget: string
      - label: Region label
        name: region
        widget: string
        required: false
        hint: e.g. East Africa
      - label: Intro blurb
        name: blurb
        widget: text
        required: false
        hint: One or two sentences shown under the country name
      - label: Activities
        name: activities
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
        - label: Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
        - label: Category
          name: category
          widget: select
          options:
          - culture
          - nature
          - food
          - adventure
        - label: Duration
          name: duration
          widget: select
          options:
          - label: Morning
            value: morning
          - label: Evening
            value: evening
          - label: Half day
            value: half
          - label: Full day
            value: full
          - label: Multi-day
            value: multi
        - label: Photo
          name: image
          widget: image
          required: false
- name: gallery
  label: Gallery
