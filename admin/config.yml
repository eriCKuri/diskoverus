- name: blog
  label: Blog posts
  files:
  - name: posts
    label: All blog posts
    file: content/blog.json
    description: Write posts with full formatting — bold, italics, headings, lists, quotes, and images anywhere in the text. Newest post appears first on the blog.
    fields:
    - label: Posts
      name: posts
      widget: list
      summary: '{{fields.title}}'
      fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: postDate
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: Used to sort posts — newest first
      - label: Date line
        name: date
        widget: string
        required: false
        hint: Shown above the title, e.g. July 2026 · Field notes
      - label: Cover image
        name: image
        widget: image
        required: false
        hint: Large photo at the top of the post
      - label: Summary
        name: excerpt
        widget: text
        required: false
        hint: 1–2 sentences shown on the homepage and in search results
      - label: Countries
        name: countries
        widget: select
        multiple: true
        required: false
        options: *id001
        hint: Tag the countries this post covers — it will then appear on those countries in the map and on their guide pages
      - label: Body
        name: body
        widget: markdown
        hint: Use the toolbar for bold, italic, headings, lists, quotes and images. Click the + to insert an image mid-article.
