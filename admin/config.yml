- name: destinations
  label: Destinations
  files:
  - name: countries
    label: Country content
    file: content/places.json
    description: 'Edit a country''s intro and activities, or add a brand-new country. IMPORTANT: the country name must exactly match its map name (e.g. Rwanda, Kenya, New Zealand).'
    fields:
    - label: Countries
      name: countries
      widget: list
      summary: '{{fields.name}}'
      fields:
      - label: Country name (must match the map)
        name: name
        widget: string
      - label: Region label
        name: region
        widget: string
        required: false
        hint: e.g. East Africa
      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: Shown at the top of this country's guide page and in the map panel, with a fade so text stays readable. Landscape, ~1200px wide.
      - label: Intro blurb
        name: blurb
        widget: text
        required: false
        hint: One or two sentences shown under the country name
      - label: What makes it different
        name: uniqueness
        widget: text
        required: false
        hint: A short, factual note on what this country offers that others don't — shown under the intro.
      - label: Snapshot card
        name: snapshot
        widget: object
        required: false
        hint: Quick facts shown in a card at the top of the country page — budget, visa, currency, and a few star ratings.
        fields:
        - label: Budget level
          name: budget
          widget: select
          required: false
          options:
          - {label: '$ — Budget-friendly', value: '$'}
          - {label: '$$ — Moderate', value: '$$'}
          - {label: '$$$ — Splurge', value: '$$$'}
        - label: Daily budget (USD)
          name: dailyBudget
          widget: object
          required: false
          hint: Typical mid-range daily spend per person — lodging, food, local transport, some activities. Excludes international flights. Powers the budget-range slider in "Find my trip match."
          fields:
          - {label: 'Low end ($/day)', name: low, widget: number, required: false, value_type: int}
          - {label: 'High end ($/day)', name: high, widget: number, required: false, value_type: int}
        - label: Visa note
          name: visa
          widget: string
          required: false
          hint: Short and factual, e.g. "Visa-free 90 days (Schengen) for US/UK/EU" — always tell travelers to double-check for their own nationality
        - label: Currency
          name: currency
          widget: string
          required: false
        - label: Languages
          name: languages
          widget: string
          required: false
        - label: Recommended trip length
          name: tripLength
          widget: string
          required: false
          hint: e.g. 7-10 days
        - label: Internet quality
          name: internet
          widget: string
          required: false
          hint: e.g. Excellent, Good, Patchy outside cities
        - label: Typical nightly lodging (USD)
          name: lodging
          widget: object
          required: false
          hint: Typical budget-to-mid-range nightly stay cost (hotel or Airbnb-style), the way Booking.com/Airbnb show a price range. Separate from the daily budget above, which covers a whole day's spend.
          fields:
          - {label: 'Low end ($/night)', name: low, widget: number, required: false, value_type: int}
          - {label: 'High end ($/night)', name: high, widget: number, required: false, value_type: int}
        - label: Practical info
          name: practical
          widget: object
          required: false
          hint: The small logistics questions every traveler forgets to ask — shown in its own card on the country page and in Ask Diskover.
          fields:
          - {label: 'Which side of the road', name: driving, widget: select, required: false, options: ['left', 'right']}
          - {label: 'Power outlets & voltage', name: voltage, widget: string, required: false, hint: 'e.g. 230V / 50Hz (Type C/F plug) — mention if a converter is needed, not just an adapter'}
          - {label: 'Time zone', name: timezone, widget: string, required: false, hint: 'e.g. UTC+3, or "Multiple zones" for large countries'}
          - {label: 'Emergency number', name: emergency, widget: string, required: false, hint: 'The number to save on arrival. If it varies locally, say so rather than guessing — this field is safety-sensitive.'}
        - label: Travel-smart note
          name: travelSmart
          widget: text
          required: false
          hint: One or two plain-language sentences on tap water safety and tipping norms — the kind of thing a friend who's been there would mention.
        - label: Star ratings
          name: ratings
          widget: list
          required: false
          summary: '{{fields.category}} — {{fields.stars}}★'
          hint: Pick 2-3 categories that best describe this destination
          fields:
          - label: Category
            name: category
            widget: select
            options:
            - Adventure
            - Wildlife
            - Culture
            - Food
            - Photography
            - Luxury
            - Beaches
            - Nightlife
          - label: Stars (1-5)
            name: stars
            widget: number
            value_type: int
            min: 1
            max: 5
      - label: Best time to visit
        name: seasons
        widget: list
        required: false
        summary: '{{fields.label}} — {{fields.months}}'
        hint: Add a row per season. Shown as a "When to go" block.
        fields:
        - label: Season
          name: label
          widget: string
          hint: e.g. Spring, Dry season, Shoulder months
        - label: Months
          name: months
          widget: string
          hint: e.g. April–May
        - label: What it's like
          name: note
          widget: text
          hint: Weather, crowds, prices, what's happening
      - label: Frequently asked questions
        name: faq
        widget: list
        required: false
        summary: '{{fields.q}}'
        hint: Answer the real questions travelers search for, e.g. "Is Rwanda safe?" — shown near the top of the page and marked up for Google.
        fields:
        - label: Question
          name: q
          widget: string
        - label: Answer
          name: a
          widget: text
      - label: Activities
        name: activities
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
        - label: Title
          name: title
          widget: string
        - label: Description
          name: description
          widget: text
        - label: Theme
          name: theme
          widget: select
          required: false
          options:
          - Wildlife & nature
          - Culture & history
          - Food & markets
          - Adventure & outdoors
          - Coast & water
          - Cities & design
          - Slow days
          hint: Groups this activity on the page
        - label: Category
          name: category
          widget: select
          options:
          - culture
          - nature
          - food
          - adventure
        - label: Duration
          name: duration
          widget: select
          options:
          - label: Morning
            value: morning
          - label: Evening
            value: evening
          - label: Half day
            value: half
          - label: Full day
            value: full
          - label: Multi-day
            value: multi
        - label: Photo
          name: image
          widget: image
          required: false
        - label: When
          name: when
          widget: string
          required: false
          hint: e.g. June–July, Year-round, Best at sunrise
- name: gallery
  label: Gallery
  files:
  - name: photos
    label: Gallery photos
    file: content/gallery.json
    description: Photos shown on the Gallery page, each linked to its country. Keep images web-sized (under ~2 MB).
    fields:
    - label: Photos
      name: items
      widget: list
      summary: '{{fields.country}} — {{fields.place}} {{fields.caption}}'
      fields:
      - label: Photo
        name: image
        widget: image
        required: false
        hint: For several photos from the same spot at once, use the "＋ Bulk photo upload" button instead of adding them here.
      - label: Country
        name: country
        widget: select
        options: *id001
      - label: Place name
        name: place
        widget: string
        required: false
        hint: e.g. Bigogwe, Gahinga Trail, Volcanoes National Park — photos with the same place name are grouped together
      - label: Location detail
        name: location
        widget: string
        required: false
        hint: Exact place, e.g. Northern Province, Musanze — shown on the photo
      - label: Google Maps link or address
        name: mapLink
        widget: string
        required: false
        hint: Paste a Google Maps share link, or just type/paste the address — either works
      - label: Caption
        name: caption
        widget: string
        required: false
        hint: e.g. Sunrise over the Maasai Mara
      - label: Photo credit
        name: credit
        widget: string
        required: false
        hint: Only fill this in if the photo isn't yours — e.g. "Jane Doe" or "@handle". Leave blank for your own photos.
      - label: Date added
        name: added
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: Newest photos show first
  - name: videos
    label: Gallery videos
    file: content/videos.json
